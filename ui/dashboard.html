<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Dashboard | SaQshi</title>

    <link rel="manifest" href="/ui/manifest.webmanifest">

    <link rel="stylesheet" href="/ui/assets/css/sq-ui.css?v=20260730-mobile-2">

    <link
        rel="stylesheet"
        href="/ui/assets/vendor/bootstrap-icons/bootstrap-icons.min.css?v=1.11.3">
</head>

<body class="sq-app">

    <div id="sq-root"></div>

    <!-- Core JS -->
    <script src="/ui/assets/js/sq-ui.js?v=20260702-13"></script>
    <script src="/ui/assets/js/core/storage.js"></script>
    <script src="/ui/assets/js/core/api.js?v=20260718-1"></script>
    <script src="/ui/assets/js/core/auth.js?v=20260803-logout-1"></script>
    <script src="/ui/assets/js/core/deployment.js?v=20260729-2"></script>
    <script src="/ui/assets/js/core/validator.js"></script>
    <script src="/ui/assets/js/core/a11y.js?v=20260717-1"></script>
    <script src="/ui/assets/js/core/upload.js?v=20260704-2"></script>
    <script src="/ui/assets/js/core/pagination.js?v=20260713-1"></script>
    <script src="/ui/assets/js/core/router.js?v=20260822-enforce-password-change-2"></script>
    <script src="/ui/assets/js/core/chat.js"></script>
    <script src="/ui/assets/js/core/component-loader.js?v=20260822-state-user-management-1"></script>
    <script src="/ui/assets/js/app.js?v=20260806-mobile-sidebar-1"></script>

    <!-- Page Bootstrap -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            if (window.SQ && SQ.router) {
                const user =
                    SQ.auth && SQ.auth.getUser
                        ? SQ.auth.getUser()
                        : null;
                const requestedRoute = SQ.router.currentRouteFromUrl
                    ? SQ.router.currentRouteFromUrl()
                    : "dashboard";
                const monitoringRoles = [4, 5, 8, 9];
                const isManagementRole = Number(user && user.role_id) === 11;
                const isAssessor =
                    Number(user && user.role_id) === 10 ||
                    /assessor/i.test(String(user && user.role_name || ""));
                const route = isManagementRole
                    ? "state/users"
                    : isAssessor && requestedRoute === "dashboard"
                    ? "assessor/facilities"
                    : monitoringRoles.indexOf(Number(user && user.role_id)) !== -1 && requestedRoute === "dashboard"
                    ? "state/dashboard"
                    : requestedRoute;

                SQ.router.navigate(
                    route,
                    {},
                    {
                        history: false
                    }
                );
            }
        });
    </script>

</body>

</html>
