<section class="sq-state-page">
    <div class="sq-state-toolbar">
        <div>
            <h3>Indicator Analytics</h3>
            <p>Checklist indicators ranked by schools in the lowest configured score band.</p>
        </div>
        <div class="sq-state-filters">
            <input type="search" class="sq-form-control" id="stateIndicatorSearch" placeholder="Search school, UDISE code, district or block" aria-label="Search School, UDISE Code, District Or Block">
            <input type="number" class="sq-form-control" id="stateIndicatorMinFacilities" min="1" value="1" title="Minimum schools">
            <button class="sq-btn sq-btn-primary" id="stateIndicatorRefresh">Refresh</button>
        </div>
    </div>

    <div class="sq-state-kpis" id="stateIndicatorSummary"></div>

    <div class="sq-card">
        <div class="sq-card-header">
            <h3>Checklist Indicators With Most Low-Score Schools</h3>
            <div id="stateIndicatorPager"></div>
        </div>
        <div class="sq-card-body" id="stateAssessmentIndicators"></div>
    </div>
</section>
