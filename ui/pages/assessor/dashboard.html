<!-- SaQshi Open Source | Assessor Dashboard | dashboard.html | Version 1.0.0 -->
<section class="sq-assessor-page">
    <div class="sq-assessor-toolbar">
        <div>
            <h3 data-domain-label="assessor_dashboard">Assessor Dashboard</h3>
            <p data-domain-content="assessor_choose_item">Choose the facility where you will perform assessment.</p>
        </div>
        <div class="sq-assessor-actions">
            <button class="sq-btn sq-btn-muted sq-assessor-report-btn" id="assessorAssessmentReport" type="button">Download Assessment Report</button>
            <button class="sq-btn sq-btn-primary" id="assessorDashboardRefresh" type="button">Refresh</button>
        </div>
    </div>

    <div class="sq-assessor-kpis">
        <div class="sq-assessor-kpi sq-assessor-kpi--assigned"><span data-domain-label="assigned_facilities">Assigned Facilities</span><strong id="assessorTotalFacilities">0</strong></div>
        <div class="sq-assessor-kpi sq-assessor-kpi--total"><span data-domain-template="Total {assessments}">Total Assessments</span><strong id="assessorTotalAssessments">0</strong></div>
        <div class="sq-assessor-kpi sq-assessor-kpi--completed"><span>Completed</span><strong id="assessorCompletedAssessments">0</strong></div>
        <div class="sq-assessor-kpi sq-assessor-kpi--progress"><span>In Progress</span><strong id="assessorInProgressAssessments">0</strong></div>
        <div class="sq-assessor-kpi sq-assessor-kpi--not-started"><span>Not Started</span><strong id="assessorNotStartedFacilities">0</strong></div>
    </div>

    <div class="sq-card sq-assessor-card sq-assessor-card--facilities">
        <div class="sq-card-header">
            <h3 data-domain-label="mapped_facilities">Mapped Facilities</h3>
            <p>Use the next action to continue from the exact pending step.</p>
        </div>
        <div class="sq-card-body" id="assessorFacilityRows"></div>
    </div>

    <div class="sq-card sq-assessor-card sq-assessor-card--summary" id="assessorFacilitySummaryCard" hidden>
        <div class="sq-card-header sq-assessor-summary-header">
            <div>
                <h3 id="assessorFacilitySummaryTitle" data-domain-template="{facility} Details">Facility Details</h3>
                <p id="assessorFacilitySummaryMeta">Assessment, CQI and performance history.</p>
            </div>
            <button class="sq-btn sq-btn-muted" id="assessorFacilitySummaryClose" type="button">Close</button>
        </div>
        <div class="sq-card-body" id="assessorFacilitySummaryBody"></div>
    </div>
</section>
